<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Language" content="no">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portefølje</title>
  <meta name="description" content="Personlig side med lenker, prosjekter og publisering.">

  <!-- Favicons -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#0b0c10">
  <meta name="theme-color" content="#0b0c10">

  <style>
    :root{
      --bg:#0b0c10; --panel:#111218; --text:#e8eaed; --muted:#9aa0a6;
      --brand:#5b8def; --brand2:#7af0b6; --r:16px; --border:rgba(255,255,255,.10); --panel-2:rgba(255,255,255,.04);
    }
    *{box-sizing:border-box} html{scroll-behavior:smooth}
    body{
      margin:0; min-height:100%;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Helvetica,Arial; color:var(--text);
      background:
        radial-gradient(140vmax 95vmax at 20% -10%, rgba(91,141,239,.18), transparent 40%),
        radial-gradient(110vmax 70vmax at 90% 0%,   rgba(122,240,182,.10), transparent 40%),
        var(--bg);
      background-attachment: fixed, fixed, scroll; background-repeat:no-repeat;
    }
    .wrap{width:min(960px,92%);margin:0 auto}
    .links{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;text-decoration:none;color:var(--text);border:1px solid var(--border);background:var(--panel-2);font-weight:600;font-size:14px;transition:transform .12s ease,background .12s ease,border-color .12s ease}
    .btn:active{transform:translateY(1px)} .btn:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.18)}
    .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
    .btn.primary:hover{background:#4a7bd8}

    main{padding:56px 0}
    .grid{display:grid;grid-template-columns:1.1fr .9fr;gap:32px}
    @media (max-width:900px){.grid{grid-template-columns:1fr}}
    .card{background:var(--panel);border:1px solid rgba(255,255,255,.08);border-radius:var(--r);padding:18px}
    h1{font-size:clamp(28px,5vw,44px);margin:.4em 0 .2em}
    .muted{color:var(--muted)} .tagline{color:var(--brand);font-weight:600;letter-spacing:.02em;margin:0 0 10px;font-size:15px} section{margin-top:28px} h2{margin:0 0 6px;font-size:22px}
    .project-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:14px}
    .project-card{background:var(--panel-2);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px}
    .project-icon{font-size:24px;line-height:1}
    .project-title{font-weight:700;font-size:16px}
    .project-desc{color:var(--muted);font-size:13.5px;line-height:1.5;flex:1}
    .project-link{align-self:flex-start;font-size:13px;color:var(--brand);text-decoration:none;font-weight:600}
    .project-link:hover{text-decoration:underline}
    ul{margin:0;padding-left:18px}.list a{color:var(--text);opacity:.9}
    .hero-card{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
    .hero-text{flex:1;min-width:220px}
    .avatar{width:92px;height:92px;flex:none;border-radius:50%;overflow:hidden;border:2px solid rgba(255,255,255,.12);background:#0d0f15}
    .avatar img{width:100%;height:100%;object-fit:cover;display:block}
    .hidden{display:none!important}
  </style>

  <script src="/config.js"></script>
  <script src="/common.js"></script>
</head>
<body>
  <main class="wrap" id="top">
    <div class="grid">
      <div class="card hero-card">
        <div class="avatar hidden" id="avatarBox">
          <img id="avatarImg" alt="Profilbilde">
        </div>
        <div class="hero-text">
          <h1 id="name">&nbsp;</h1>
          <p class="tagline hidden" id="title">&nbsp;</p>
          <p class="muted" id="desc">&nbsp;</p>
          <div class="links" id="cta"></div>
        </div>
      </div>

      <div class="card hidden" id="publishedBox">
        <h2>Publisert</h2>
        <p class="muted">Saker / omtale</p>
        <ul class="list" id="publishedList"></ul>
      </div>
    </div>

    <section class="card hidden" id="projectsBox">
      <h2>Prosjekter</h2>
      <div class="project-grid" id="projectsList"></div>
    </section>
  </main>

<script>
  /* Side-spesifikk logikk for index */
  function isNonEmptyStr(v){return typeof v==='string' && v.trim()!==''}
  function toArrayMaybeCSV(val){ if(Array.isArray(val)) return val; if(isNonEmptyStr(val)) return val.split(',').map(s=>s.trim()).filter(Boolean); return [] }
  function normalizeUrl(u){
    if(!isNonEmptyStr(u)) return '';
    if(u.startsWith('/') || u.startsWith('./')) return u;
    if(/^https?:\/\//i.test(u)) return u;
    if(/^[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/.test(u)) return 'https://' + u;
    return u;
  }
  function titleToSlug(name){
    return name
      .replace(/Æ/g,'Ae').replace(/Ø/g,'O').replace(/Å/g,'A')
      .replace(/æ/g,'ae').replace(/ø/g,'o').replace(/å/g,'a')
      .replace(/\s+/g,'_').replace(/[^A-Za-z0-9_]/g,'');
  }
  function getConfig(){ return (window.siteConfig && typeof window.siteConfig==='object') ? window.siteConfig : {} }

  document.addEventListener('DOMContentLoaded', () => {
    // injiser felles header/footer
    window.renderChrome?.();

    const c = getConfig();
    document.title = (c.my_name ? c.my_name + ' – ' : '') + 'Portefølje';

    if(isNonEmptyStr(c.my_name)) document.getElementById('name').textContent = c.my_name;
    if(isNonEmptyStr(c.my_title)){ document.getElementById('title').textContent = c.my_title; document.getElementById('title').classList.remove('hidden'); }
    if(isNonEmptyStr(c.my_description)) document.getElementById('desc').textContent = c.my_description;
    else document.getElementById('desc').classList.add('hidden');

    // bilde
    if(isNonEmptyStr(c.linkedin_profile_pic_url)){
      const img=document.getElementById('avatarImg');
      img.src=normalizeUrl(c.linkedin_profile_pic_url);
      img.referrerPolicy='no-referrer';
      img.addEventListener('load',()=>document.getElementById('avatarBox').classList.remove('hidden'));
      img.addEventListener('error',()=>document.getElementById('avatarBox').classList.add('hidden'));
    }

    // Handlingsknapper på kortet
    const cta=document.getElementById('cta');
    function addCta(label, href, primary){
      if(!isNonEmptyStr(href)) return;
      const a=document.createElement('a'); a.className='btn'+(primary?' primary':''); a.href=normalizeUrl(href); a.target='_blank'; a.rel='noopener'; a.textContent=label; cta.appendChild(a);
    }
    addCta('LinkedIn', c.linkedin_url, false);
    addCta('GitHub', c.github_url, false);
    addCta('Last ned CV', c.cv_url, true);

    // Publisert
    const pubs=[c.published_url, ...(Array.isArray(c.published_urls)?c.published_urls:[])].filter(isNonEmptyStr).map(normalizeUrl);
    if(pubs.length){
      const ul=document.getElementById('publishedList');
      pubs.forEach(u=>{
        const li=document.createElement('li'); const a=document.createElement('a'); a.href=u; a.target='_blank'; a.rel='noopener';
        let label='Les artikkelen →';
        try{ label=new URL(u).hostname.replace(/^www\./,'') + ' – Les artikkelen →'; }catch(e){}
        a.textContent=label; li.appendChild(a); ul.appendChild(li);
      });
      document.getElementById('publishedBox').classList.remove('hidden');
    }

    // Prosjekter (kort)
    const featured = Array.isArray(c.featured_projects) ? c.featured_projects : [];
    if(featured.length){
      const grid=document.getElementById('projectsList');
      featured.forEach(p=>{
        const card=document.createElement('div'); card.className='project-card';
        if(isNonEmptyStr(p.icon)){ const ic=document.createElement('div'); ic.className='project-icon'; ic.textContent=p.icon; card.appendChild(ic); }
        const t=document.createElement('div'); t.className='project-title'; t.textContent=p.title||''; card.appendChild(t);
        if(isNonEmptyStr(p.description)){ const d=document.createElement('div'); d.className='project-desc'; d.textContent=p.description; card.appendChild(d); }
        if(isNonEmptyStr(p.link)){ const a=document.createElement('a'); a.className='project-link'; a.href=normalizeUrl(p.link); if(/^https?:\/\//i.test(p.link)){a.target='_blank'; a.rel='noopener';} a.textContent=p.linkLabel||'Les mer →'; card.appendChild(a); }
        grid.appendChild(card);
      });
      document.getElementById('projectsBox').classList.remove('hidden');
    }
  });
</script>
</body>
</html>
