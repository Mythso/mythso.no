<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Language" content="no">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Vane – Fullfører LinkedIn-innlogging</title>

  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#ffffff">

  <style>
    :root{
      --bg:#f7f8fa; --panel:#ffffff; --text:#161821; --muted:#667085;
      --brand:#3b6fe0; --brand2:#2fd48a; --border:rgba(16,24,40,.10); --r:16px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Helvetica,Arial;
      color:var(--text);background:var(--bg);
      display:flex;align-items:center;justify-content:center;min-height:100vh;
    }
    .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:clamp(24px,6vw,40px);text-align:center;max-width:420px;width:92%}
    .spinner{
      width:36px;height:36px;margin:0 auto 18px;border-radius:50%;
      border:3px solid var(--border);border-top-color:var(--brand);
      animation:spin 0.8s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    h2{font-size:19px;margin:0 0 8px}
    p{color:var(--muted);font-size:15px;line-height:1.5;margin:0}
  </style>

  <script>
    function openVaneApp() {
      // Sender autorisasjonskoden (?code=...) til Vane-appen via Android Deep Link
      window.location.href = "vane://linkedin-callback" + window.location.search;
    }
    window.onload = openVaneApp;
  </script>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2>Åpner Vane-appen …</h2>
    <p>Vennligst vent mens vi fullfører din LinkedIn-tilkobling.</p>
  </div>
</body>
</html>
