<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>allowlist</title>
  <script src="/config.js"></script>
</head>
<body>
<script>
(function () {
  function isNonEmptyStr(v){ return typeof v === 'string' && v.trim() !== '' }

  // Vent til config.js er lastet (inntil ~2 sek)
  var tries = 0, maxTries = 40;
  (function waitForConfig(){
    var sc = window.siteConfig;
    var ok = sc && Array.isArray(sc.allow_hosts);
    if (ok) {
      var hosts = sc.allow_hosts.filter(isNonEmptyStr)
        .map(h => h.trim())
        .sort((a,b) => a.localeCompare(b, 'no', { sensitivity: 'base' }));
      document.body.textContent = hosts.join('\n') + (hosts.length ? '\n' : '');
    } else if (tries++ < maxTries) {
      setTimeout(waitForConfig, 50);
    } else {
      document.body.textContent = '';
    }
  })();
})();
</script>
</body>
</html>
